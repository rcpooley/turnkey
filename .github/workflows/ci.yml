name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: turnkey_test
          POSTGRES_DB: turnkey_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnkey_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Dolt
        run: |
          sudo bash -c 'curl -sSfL https://github.com/dolthub/dolt/releases/latest/download/install.sh | bash'
          dolt config --global --add user.name ci
          dolt config --global --add user.email ci@example.com
      - run: npm ci
      - run: scripts/test-dolt.sh start
      - run: npm test
        env:
          TURNKEY_TEST_PG: postgres://turnkey_test@127.0.0.1:5432/turnkey_test
          TURNKEY_TEST_DOLT: mysql://root@127.0.0.1:3518
